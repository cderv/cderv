name: Update stats card

on:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi, 6 h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update-stats-card.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=cderv&show_icons=true&hide_border=true&hide=stars&show=prs_merged,reviews&theme_light=light_github&theme_dark=dark_github&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update stats card" || exit 0
          git push
